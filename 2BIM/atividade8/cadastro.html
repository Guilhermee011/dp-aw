<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Cadastro</title>
</head>
<body>

    <h1>Cadastro de Usuário</h1>

    <form action="#" method="post">

        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" required><br><br>

        <label for="cidade">Cidade:</label><br>
        <input type="text" id="cidade" name="cidade" required><br><br>

        <label for="estado">Estado:</label><br>
        <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="RS">Rio Grande do Sul</option>
        </select>
        <br><br>

        <label>Gênero:</label><br>
        <input type="radio" id="masc" name="genero" value="masculino">
        <label for="masc">Masculino</label><br>

        <input type="radio" id="fem" name="genero" value="feminino">
        <label for="fem">Feminino</label><br>

        <input type="radio" id="outro" name="genero" value="outro">
        <label for="outro">Outro</label><br><br>

        <label>Interesses:</label><br>

        <input type="checkbox" id="tec" name="interesses" value="tecnologia">
        <label for="tec">Tecnologia</label><br>

        <input type="checkbox" id="esporte" name="interesses" value="esporte">
        <label for="esporte">Esportes</label><br>

        <input type="checkbox" id="arte" name="interesses" value="arte">
        <label for="arte">Arte</label><br><br>

        <button type="submit">Cadastrar</button>

    </form>

</body>
</html>
