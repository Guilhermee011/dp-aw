<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Landing Page Semântica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header>
        <h1>Bem-vindo à Minha Landing Page</h1>
        <nav>
            <a href="#sobre">Sobre</a>
            <a href="#servicos">Serviços</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <section id="sobre">
        <h2>Sobre Nós</h2>
        <p>Somos uma empresa dedicada a fornecer soluções digitais de alta qualidade.</p>
        <img src="https://via.placeholder.com/400x200" alt="Imagem sobre nós">
    </section>

    <section id="servicos">
        <h2>Nossos Serviços</h2>
        <ul>
            <li>Desenvolvimento Web</li>
            <li>Consultoria em TI</li>
            <li>Marketing Digital</li>
        </ul>
    </section>

    <section id="contato">
        <h2>Contato</h2>
        <form action="#" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Minha Empresa — Todos os direitos reservados.</p>
    </footer>

</body>
</html>
